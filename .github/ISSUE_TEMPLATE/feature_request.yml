name: Suggest an improvement
description: Propose a product or documentation improvement.
title: "[Idea]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What would this help you do?
      description: Describe the use case and the current difficulty.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested improvement
      description: Explain the behavior or information you would like to see.
    validations:
      required: true
