    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd2a0"/><stop offset="0.5" stop-color="#ff9948"/><stop offset="1" stop-color="#e86631"/>
